components:
  schemas:
    '[MSB] START_VERSAND_RECHNUNG':
      type: object
      required:
      - masterData
      - transactionData
      - additionalData
      properties:
        transactionData:
          type: object
          properties:
            verificationIdentifier:
              description: 'Wird dynamisch im Event-Prozess ermittelt (Entscheidungsgrundlage: rechnungstyp). Ein vom Sender mitgegebener Wert wird ignoriert. Im Topic mögliche Prüfis — 31003, 31004.'
              examples:
              - '31003'
              - '31004'
        additionalData:
          type: object
          required:
          - processId
          - eventname
          properties:
            processId:
              type: string
            eventname:
              type: string
              const: START_VERSAND_RECHNUNG
              default: START_VERSAND_RECHNUNG
      x-pending-pruefis:
      - '31003'
      - '31004'
      x-pending-dmn:
        reason: Kein Eintrag in S_EVENT_VARIABLEN.dmn — der Prozess setzt für dieses Event keine Variablen. Der Pflichtsatz von transaktionsdaten ist damit nicht bestimmbar und bleibt offen, bis die DMN-Zeile existiert.
      x-unresolved-routing:
      - variable: rechnungstyp
        discriminates: true
        selects-pruefis:
        - '31003'
        - '31004'
        conditions:
        - ${rechnungstyp=="ABSCHLUSSRECHNUNG"}
        - ${rechnungstyp=="WIMRECHNUNG"}
