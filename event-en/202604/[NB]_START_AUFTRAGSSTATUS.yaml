      - transactionData
      - additionalData
      properties:
        masterData:
          oneOf:
          - allOf:
            - $ref: ../../event-bauteil-en/202604/IFTSTA/PI_21039.yaml#/components/schemas/PI_21039__masterData
            - type: object
              required:
              - STATUS_NOTIFICATION
              properties:
                STATUS_NOTIFICATION:
                  type: array
                  items:
                    type: object
                    required:
                    - orderStatus
                    properties:
                      orderStatus:
                        $ref: ../../bo4e-en/fields/bo/StatusNotification/orderStatus.yaml#/components/schemas/orderStatus
                        x-process-routing:
                        - variable: auftragsstatus
                          source: $.stammdaten.STATUSMITTEILUNG[0].auftragsstatus
                          selects-pruefi: '21039'
                          conditions:
                          - ${auftragsstatus!="GEPLANT"}
          - allOf:
            - $ref: ../../event-bauteil-en/202604/IFTSTA/PI_21040.yaml#/components/schemas/PI_21040__masterData
            - type: object
              required:
              - STATUS_NOTIFICATION
              properties:
                STATUS_NOTIFICATION:
                  type: array
                  items:
                    type: object
                    required:
                    - orderStatus
                    properties:
                      orderStatus:
                        $ref: ../../bo4e-en/fields/bo/StatusNotification/orderStatus.yaml#/components/schemas/orderStatus
                        x-process-routing:
                        - variable: auftragsstatus
                          source: $.stammdaten.STATUSMITTEILUNG[0].auftragsstatus
                          selects-pruefi: '21040'
                          conditions:
                          - ${auftragsstatus=="GEPLANT"}
        transactionData:
          type: object
          required:
          - sender
          - responseStatus
          - responseStatusCodeList
          - receiver
          - completionDate
          - sector
          properties:
            sender:
              type: object
              properties:
                roleCodeNumber:
                  $ref: ../../bo4e-en/fields/bo/MarketParticipant/roleCodeNumber.yaml#/components/schemas/roleCodeNumber
            responseStatus:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/responseStatus.yaml#/components/schemas/responseStatus
            responseStatusCodeList:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/responseStatusCodeList.yaml#/components/schemas/responseStatusCodeList
            receiver:
              type: object
              properties:
                roleCodeNumber:
                  $ref: ../../bo4e-en/fields/bo/MarketParticipant/roleCodeNumber.yaml#/components/schemas/roleCodeNumber
            completionDate:
