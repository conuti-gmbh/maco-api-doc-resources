          - $ref: ../../event-bauteil-en/202604/UTILTS/PI_25008.yaml#/components/schemas/PI_25008__masterData
          - $ref: ../../event-bauteil-en/202604/UTILTS/PI_25009.yaml#/components/schemas/PI_25009__masterData
