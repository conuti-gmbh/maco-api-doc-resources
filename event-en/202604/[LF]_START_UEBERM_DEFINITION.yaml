components:
  schemas:
    '[LF] START_UEBERM_DEFINITION':
      type: object
      required:
      - masterData
      - transactionData
      - additionalData
      properties:
        masterData:
          oneOf:
          - $ref: ../../event-bauteil-en/202604/UTILTS/PI_25005.yaml#/components/schemas/PI_25005__masterData
          - $ref: ../../event-bauteil-en/202604/UTILTS/PI_25008.yaml#/components/schemas/PI_25008__masterData
          - $ref: ../../event-bauteil-en/202604/UTILTS/PI_25009.yaml#/components/schemas/PI_25009__masterData
        transactionData:
          type: object
          required:
          - sender
          - inquiryReference
          - receiver
          - category
          - sector
          properties:
            sender:
              type: object
              properties:
                roleCodeNumber:
                  $ref: ../../bo4e-en/fields/bo/MarketParticipant/roleCodeNumber.yaml#/components/schemas/roleCodeNumber
            inquiryReference:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/inquiryReference.yaml#/components/schemas/inquiryReference
            receiver:
              type: object
              properties:
                roleCodeNumber:
                  $ref: ../../bo4e-en/fields/bo/MarketParticipant/roleCodeNumber.yaml#/components/schemas/roleCodeNumber
            category:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/category.yaml#/components/schemas/category
            sector:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/sector.yaml#/components/schemas/sector
            verificationIdentifier:
              description: Wird dynamisch im Event-Prozess ermittelt (Sparte + Transaktionsgrund + Empfänger-Marktrolle). Ein vom Sender mitgegebener Wert wird ignoriert. Im Topic mögliche Prüfis — 25005, 25008, 25009.
              examples:
              - '25005'
              - '25008'
              - '25009'
        additionalData:
          type: object
          required:
          - processId
          - eventname
          properties:
            processId:
              type: string
            eventname:
              type: string
              const: START_UEBERM_DEFINITION
              default: START_TRANSMISSION_DEFINITION
