openapi: 3.1.0
info:
  title: '[LF] START_GESCHAEFTSDATENANFRAGE'
  version: '202510'
  x-bpmn-source-sha: c879f7d2
  x-bo4e-schema-version: 1.7.8
  x-templater-sha: 41b3eb8c66d69f8953cbfe2ce874d41618f10ca0
components:
  schemas:
    '[LF] START_GESCHAEFTSDATENANFRAGE':
      type: object
      required:
      - masterData
      - transactionData
      - additionalData
      properties:
        masterData:
          anyOf:
          - allOf:
            - $ref: ../../event-bauteil-en/202510/ORDERS/PI_17102.yaml#/components/schemas/PI_17102__masterData
            - type: object
              required:
              - REQUEST
              properties:
                REQUEST:
                  type: array
                  items:
                    type: object
                    required:
                    - requestCategory
                    properties:
                      requestCategory:
                        $ref: ../../bo4e-en/fields/bo/Request/requestCategory.yaml#/components/schemas/requestCategory
                        x-process-routing:
                        - variable: anfragekategorie
                          source: $.stammdaten.ANFRAGE[0].anfragekategorie
                          selects-pruefi: '17102'
                          conditions:
                          - ${anfragekategorie=="PROZESSDATENBERICHT" or anfragekategorie=="ENERGIEMENGE_UND_LEISTUNGSMAXIMUM" or  anfragekategorie=="LASTGANG_MALO_TRANCHE"}
          - allOf:
            - $ref: ../../event-bauteil-en/202510/ORDERS/PI_17132.yaml#/components/schemas/PI_17132__masterData
            - type: object
              required:
              - REQUEST
              properties:
                REQUEST:
                  type: array
                  items:
                    type: object
                    required:
                    - requestCategory
                    properties:
                      requestCategory:
                        $ref: ../../bo4e-en/fields/bo/Request/requestCategory.yaml#/components/schemas/requestCategory
                        x-process-routing:
                        - variable: anfragekategorie
                          source: $.stammdaten.ANFRAGE[0].anfragekategorie
                          selects-pruefi: '17132'
                          conditions:
                          - ${anfragekategorie=="STAMMDATEN_MALO_ODER_MELO"}
        transactionData:
          type: object
          required:
          - sender
          - receiver
          - category
          - sector
          properties:
            sender:
              type: object
              properties:
                roleCodeNumber:
                  $ref: ../../bo4e-en/fields/bo/MarketParticipant/roleCodeNumber.yaml#/components/schemas/roleCodeNumber
            receiver:
              type: object
              properties:
                roleCodeNumber:
                  $ref: ../../bo4e-en/fields/bo/MarketParticipant/roleCodeNumber.yaml#/components/schemas/roleCodeNumber
            category:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/category.yaml#/components/schemas/category
            sector:
              $ref: ../../bo4e-en/fields/cdoc/TransactionData/sector.yaml#/components/schemas/sector
            verificationIdentifier:
              description: 'Wird dynamisch im Event-Prozess ermittelt (Entscheidungsgrundlage: anfragekategorie). Ein vom Sender mitgegebener Wert wird ignoriert. Im Topic mögliche Prüfis — 17102, 17132.'
              examples:
              - '17102'
              - '17132'
        additionalData:
          type: object
          required:
          - processId
          - eventname
          properties:
            processId:
              type: string
            eventname:
              type: string
              const: START_GESCHAEFTSDATENANFRAGE
              default: START_BUSINESS_DATA_REQUEST
