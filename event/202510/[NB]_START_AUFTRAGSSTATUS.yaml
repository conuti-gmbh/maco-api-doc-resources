openapi: 3.1.0
info:
  title: '[NB] START_AUFTRAGSSTATUS'
  version: '202510'
  x-bpmn-source-sha: 0d076b33
  x-bo4e-schema-version: 1.7.8
  x-templater-sha: 41b3eb8c66d69f8953cbfe2ce874d41618f10ca0
components:
  schemas:
    '[NB] START_AUFTRAGSSTATUS':
      type: object
      required:
        - stammdaten
        - transaktionsdaten
        - zusatzdaten
      properties:
        stammdaten:
          anyOf:
            - allOf:
                - $ref: ../../event-bauteil/202510/IFTSTA/PI_21039.yaml#/components/schemas/PI_21039__stammdaten
                - type: object
                  required:
                    - STATUSMITTEILUNG
                  properties:
                    STATUSMITTEILUNG:
                      type: array
                      items:
                        type: object
                        required:
                          - auftragsstatus
                        properties:
                          auftragsstatus:
                            $ref: ../../bo4e/fields/bo/Statusmitteilung/auftragsstatus.yaml#/components/schemas/auftragsstatus
                            x-process-routing:
                              - variable: auftragsstatus
                                source: $.stammdaten.STATUSMITTEILUNG[0].auftragsstatus
                                selects-pruefi: '21039'
                                conditions:
                                  - ${auftragsstatus!="GEPLANT"}
            - allOf:
                - $ref: ../../event-bauteil/202510/IFTSTA/PI_21040.yaml#/components/schemas/PI_21040__stammdaten
                - type: object
                  required:
                    - STATUSMITTEILUNG
                  properties:
                    STATUSMITTEILUNG:
                      type: array
                      items:
                        type: object
                        required:
                          - auftragsstatus
                        properties:
                          auftragsstatus:
                            $ref: ../../bo4e/fields/bo/Statusmitteilung/auftragsstatus.yaml#/components/schemas/auftragsstatus
                            x-process-routing:
                              - variable: auftragsstatus
                                source: $.stammdaten.STATUSMITTEILUNG[0].auftragsstatus
                                selects-pruefi: '21040'
                                conditions:
                                  - ${auftragsstatus=="GEPLANT"}
        transaktionsdaten:
          type: object
          required:
            - absender
            - antwortstatus
            - antwortstatusCodeliste
            - empfaenger
            - fertigstellungsdatum
            - sparte
          properties:
            absender:
              type: object
              properties:
                rollencodenummer:
                  $ref: ../../bo4e/fields/bo/Marktteilnehmer/rollencodenummer.yaml#/components/schemas/rollencodenummer
            antwortstatus:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/antwortstatus.yaml#/components/schemas/antwortstatus
            antwortstatusCodeliste:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/antwortstatusCodeliste.yaml#/components/schemas/antwortstatusCodeliste
            empfaenger:
              type: object
              properties:
                rollencodenummer:
                  $ref: ../../bo4e/fields/bo/Marktteilnehmer/rollencodenummer.yaml#/components/schemas/rollencodenummer
            fertigstellungsdatum:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/fertigstellungsdatum.yaml#/components/schemas/fertigstellungsdatum
            sparte:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/sparte.yaml#/components/schemas/sparte
            pruefidentifikator:
              description: 'Wird dynamisch im Event-Prozess ermittelt (Entscheidungsgrundlage: auftragsstatus). Ein vom Sender mitgegebener Wert wird ignoriert. Im Topic mögliche Prüfis — 21039, 21040.'
              examples:
                - '21039'
                - '21040'
        zusatzdaten:
          type: object
          required:
            - prozessId
            - eventname
          properties:
            prozessId:
              type: string
            eventname:
              type: string
              const: START_AUFTRAGSSTATUS
              default: START_AUFTRAGSSTATUS
