openapi: 3.1.0
info:
  title: '[LF] START_GESCHAEFTSDATENANFRAGE'
  version: '202604'
  x-bpmn-source-sha: 47f8ad44
  x-bo4e-schema-version: 1.7.4
  x-templater-sha: 392a2eb2993418f8a5be64578c22568416e2d551
components:
  schemas:
    '[LF] START_GESCHAEFTSDATENANFRAGE':
      type: object
      required:
        - stammdaten
        - transaktionsdaten
        - zusatzdaten
      properties:
        stammdaten:
          oneOf:
            - allOf:
                - $ref: ../../event-bauteil/202604/ORDERS/PI_17102.yaml#/components/schemas/PI_17102__stammdaten
                - type: object
                  required:
                    - ANFRAGE
                  properties:
                    ANFRAGE:
                      type: array
                      items:
                        type: object
                        required:
                          - anfragekategorie
                        properties:
                          anfragekategorie:
                            $ref: ../../bo4e/fields/bo/Anfrage/anfragekategorie.yaml#/components/schemas/anfragekategorie
                            x-process-routing:
                              - variable: anfragekategorie
                                source: $.stammdaten.ANFRAGE[0].anfragekategorie
                                selects-pruefi: '17102'
                                conditions:
                                  - ${anfragekategorie=="PROZESSDATENBERICHT" or anfragekategorie=="ENERGIEMENGE_UND_LEISTUNGSMAXIMUM" or  anfragekategorie=="LASTGANG_MALO_TRANCHE"}
            - allOf:
                - $ref: ../../event-bauteil/202604/ORDERS/PI_17132.yaml#/components/schemas/PI_17132__stammdaten
                - type: object
                  required:
                    - ANFRAGE
                  properties:
                    ANFRAGE:
                      type: array
                      items:
                        type: object
                        required:
                          - anfragekategorie
                        properties:
                          anfragekategorie:
                            $ref: ../../bo4e/fields/bo/Anfrage/anfragekategorie.yaml#/components/schemas/anfragekategorie
                            x-process-routing:
                              - variable: anfragekategorie
                                source: $.stammdaten.ANFRAGE[0].anfragekategorie
                                selects-pruefi: '17132'
                                conditions:
                                  - ${anfragekategorie=="STAMMDATEN_MALO_ODER_MELO"}
        transaktionsdaten:
          type: object
          required:
            - absender
            - empfaenger
            - kategorie
            - sparte
          properties:
            absender:
              type: object
              properties:
                rollencodenummer:
                  $ref: ../../bo4e/fields/bo/Marktteilnehmer/rollencodenummer.yaml#/components/schemas/rollencodenummer
            empfaenger:
              type: object
              properties:
                rollencodenummer:
                  $ref: ../../bo4e/fields/bo/Marktteilnehmer/rollencodenummer.yaml#/components/schemas/rollencodenummer
            kategorie:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/kategorie.yaml#/components/schemas/kategorie
            sparte:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/sparte.yaml#/components/schemas/sparte
            pruefidentifikator:
              description: 'Wird dynamisch im Event-Prozess ermittelt (Entscheidungsgrundlage: anfragekategorie). Ein vom Sender mitgegebener Wert wird ignoriert. Im Topic mögliche Prüfis — 17102, 17132.'
              examples:
                - '17102'
                - '17132'
        zusatzdaten:
          type: object
          required:
            - prozessId
            - eventname
          properties:
            prozessId:
              type: string
            eventname:
              type: string
              const: START_GESCHAEFTSDATENANFRAGE
              default: START_GESCHAEFTSDATENANFRAGE
