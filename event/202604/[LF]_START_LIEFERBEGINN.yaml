              examples:
                - '44001'
                - '55001'
                - '55077'
                - '55600'
                - '55601'
        zusatzdaten:
          type: object
          required:
            - prozessId
            - eventname
          properties:
            prozessId:
              type: string
            eventname:
              type: string
              const: START_LIEFERBEGINN
              default: START_LIEFERBEGINN
