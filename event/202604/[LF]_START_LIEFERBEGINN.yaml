                - type: object
                  required:
                    - MARKTLOKATION
                  properties:
                    MARKTLOKATION:
                      type: array
                      items:
                        type: object
                        required:
                          - energierichtung
                        properties:
                          energierichtung:
                            $ref: ../../bo4e/fields/bo/Marktlokation/energierichtung.yaml#/components/schemas/energierichtung
                            x-process-routing:
                              - variable: energierichtung
                                source: $.stammdaten.MARKTLOKATION[0].energierichtung
                                selects-pruefi: '55001'
                                conditions:
                                  - ${energierichtung=="AUSSP"}
            - allOf:
                - $ref: ../../event-bauteil/202604/UTILMD/PI_55077.yaml#/components/schemas/PI_55077__stammdaten
                - type: object
                  required:
                    - MARKTLOKATION
                  properties:
                    MARKTLOKATION:
                      type: array
                      items:
                        type: object
                        required:
                          - energierichtung
                        properties:
                          energierichtung:
                            $ref: ../../bo4e/fields/bo/Marktlokation/energierichtung.yaml#/components/schemas/energierichtung
                            x-process-routing:
                              - variable: energierichtung
                                source: $.stammdaten.MARKTLOKATION[0].energierichtung
                                selects-pruefi: '55077'
                                conditions:
                                  - ${energierichtung=="EINSP"}
            - allOf:
                - $ref: ../../event-bauteil/202604/UTILMD/PI_55600.yaml#/components/schemas/PI_55600__stammdaten
                - type: object
                  required:
                    - MARKTLOKATION
                  properties:
                    MARKTLOKATION:
                      type: array
                      items:
                        type: object
                        required:
                          - energierichtung
                        properties:
                          energierichtung:
                            $ref: ../../bo4e/fields/bo/Marktlokation/energierichtung.yaml#/components/schemas/energierichtung
                            x-process-routing:
                              - variable: energierichtung
                                source: $.stammdaten.MARKTLOKATION[0].energierichtung
                                selects-pruefi: '55600'
                                conditions:
                                  - ${energierichtung=="AUSSP"}
            - allOf:
                - $ref: ../../event-bauteil/202604/UTILMD/PI_55601.yaml#/components/schemas/PI_55601__stammdaten
                - type: object
                  required:
                    - MARKTLOKATION
                  properties:
                    MARKTLOKATION:
                      type: array
                      items:
                        type: object
                        required:
                          - energierichtung
                        properties:
                          energierichtung:
                            $ref: ../../bo4e/fields/bo/Marktlokation/energierichtung.yaml#/components/schemas/energierichtung
                            x-process-routing:
                              - variable: energierichtung
                                source: $.stammdaten.MARKTLOKATION[0].energierichtung
                                selects-pruefi: '55601'
                                conditions:
                                  - ${energierichtung!="AUSSP"}
