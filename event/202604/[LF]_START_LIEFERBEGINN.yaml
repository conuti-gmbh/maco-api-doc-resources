          type: object
          required:
            - absender
            - empfaenger
            - kategorie
            - sparte
            - transaktionsgrund
            - transaktionsgrundergaenzung
            - vertragsbeginn
          properties:
            absender:
              type: object
              properties:
                rollencodenummer:
