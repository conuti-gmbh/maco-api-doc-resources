              examples:
                - '25005'
                - '25008'
                - '25009'
        zusatzdaten:
          type: object
          required:
            - prozessId
            - eventname
          properties:
            prozessId:
              type: string
            eventname:
              type: string
              const: START_UEBERM_DEFINITION
              default: START_UEBERM_DEFINITION
