            - $ref: ../../event-bauteil/202604/UTILTS/PI_25009.yaml#/components/schemas/PI_25009__stammdaten
        transaktionsdaten:
          type: object
          required:
            - absender
            - anfrageReferenz
            - empfaenger
            - kategorie
            - sparte
          properties:
            absender:
              type: object
              properties:
