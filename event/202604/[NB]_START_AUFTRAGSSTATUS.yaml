info:
  title: '[NB] START_AUFTRAGSSTATUS'
  version: '202604'
  x-bpmn-source-sha: b9f275c7
  x-bo4e-schema-version: 1.7.4
  x-templater-sha: 20c434c98f1808f1b10ab64bdf7a7a96d42aa7ee
components:
  schemas:
    '[NB] START_AUFTRAGSSTATUS':
      type: object
      required:
        - stammdaten
        - transaktionsdaten
        - zusatzdaten
      properties:
        stammdaten:
          oneOf:
            - $ref: ../../event-bauteil/202604/IFTSTA/PI_21039.yaml#/components/schemas/PI_21039__stammdaten
            - $ref: ../../event-bauteil/202604/IFTSTA/PI_21040.yaml#/components/schemas/PI_21040__stammdaten
        transaktionsdaten:
          type: object
          required:
            - absender
            - antwortstatus
            - antwortstatusCodeliste
            - empfaenger
            - fertigstellungsdatum
            - sparte
          properties:
            absender:
              type: object
              properties:
                rollencodenummer:
                  $ref: ../../bo4e/fields/bo/Marktteilnehmer/rollencodenummer.yaml#/components/schemas/rollencodenummer
            antwortstatus:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/antwortstatus.yaml#/components/schemas/antwortstatus
            antwortstatusCodeliste:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/antwortstatusCodeliste.yaml#/components/schemas/antwortstatusCodeliste
            empfaenger:
              type: object
              properties:
                rollencodenummer:
                  $ref: ../../bo4e/fields/bo/Marktteilnehmer/rollencodenummer.yaml#/components/schemas/rollencodenummer
            fertigstellungsdatum:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/fertigstellungsdatum.yaml#/components/schemas/fertigstellungsdatum
            sparte:
              $ref: ../../bo4e/fields/cdoc/Transaktionsdaten/sparte.yaml#/components/schemas/sparte
            pruefidentifikator:
              description: Wird dynamisch im Event-Prozess ermittelt (Sparte + Transaktionsgrund + Empfänger-Marktrolle). Ein vom Sender mitgegebener Wert wird ignoriert. Im Topic mögliche Prüfis — 21039, 21040.
              examples:
                - '21039'
                - '21040'
        zusatzdaten:
          type: object
          required:
            - prozessId
            - eventname
          properties:
            prozessId:
              type: string
            eventname:
              type: string
              const: START_AUFTRAGSSTATUS
              default: START_AUFTRAGSSTATUS
