        - zusatzdaten
      properties:
        stammdaten:
          oneOf:
            - $ref: ../../event-bauteil/202610/ORDERS/PI_17102.yaml#/components/schemas/PI_17102__stammdaten
            - $ref: ../../event-bauteil/202610/ORDERS/PI_17132.yaml#/components/schemas/PI_17132__stammdaten
        transaktionsdaten:
          type: object
          required:
            - absender
            - empfaenger
            - kategorie
